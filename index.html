<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#163b58"><link rel="manifest" href="manifest.webmanifest"><title>Agency Compass</title><style>
:root{color-scheme:light;--bg:#f3f6f9;--card:#fff;--ink:#163b58;--muted:#64748b;--line:#dbe3eb;--gold:#b88b36} [data-dark]{color-scheme:dark;--bg:#101b29;--card:#1c2b3b;--ink:#e5edf5;--muted:#aab9c8;--line:#35485b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px system-ui}header,main{max-width:850px;margin:auto;padding:20px}header{display:flex;align-items:center;justify-content:space-between}h1{font-size:23px;margin:0}h2{font-size:21px}small{color:var(--muted)}main{padding-bottom:120px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.grid .card{margin:0}.amount{font-size:clamp(20px,5vw,30px);font-weight:700;margin-top:6px}label{display:block;margin:12px 0;color:var(--muted)}input{display:block;width:100%;margin-top:5px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}button{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;cursor:pointer}nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding:8px 4px calc(8px + env(safe-area-inset-bottom))}nav button{border:0;flex:1;max-width:170px;font-size:11px;padding:8px 0}nav button span{display:block;font-size:22px}nav button[aria-current=page]{color:var(--gold);font-weight:700}.notice{font-size:13px;color:var(--muted)}.hero{border-left:4px solid var(--gold)}table{width:100%;border-collapse:collapse;font-size:13px}td,th{text-align:left;padding:8px 3px;border-bottom:1px solid var(--line)}.negative{color:#d34d4d}</style></head><body><header><div><h1>✥ Agency Compass</h1><small>Clarity. Direction. Growth.</small></div><button id="theme" aria-label="Toggle dark mode">◐</button></header><main id="main"><p>Connecting to Firebase…</p></main><nav aria-label="Main navigation"></nav><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js';
import {getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut,setPersistence,browserSessionPersistence} from 'https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js';
import {getFirestore,doc,getDocFromServer,setDoc,serverTimestamp} from 'https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore.js';
const app=initializeApp({apiKey:"AIzaSyCTtMS8MKlLYykZC4_hptOv4KnUO8y0UsI",authDomain:"agencycompass-40043.firebaseapp.com",projectId:"agencycompass-40043",storageBucket:"agencycompass-40043.firebasestorage.app",messagingSenderId:"872230775975",appId:"1:872230775975:web:7b6951257473cbcaaebf82"});
const auth=getAuth(app),db=getFirestore(app);let ready=false,current=null,epoch=0;
const pages=['Home','Employees','Agent','Marketing','Maintenance'],icons=['⌂','♙','＄','◎','⚙'],products=['Auto','Homeowners','Term life','Whole life','Supplemental health'];let page='Home';let state={revenue:0,wage:20,hours:37.5,weeks:50,tax:8,benefits:0,leads:0,leadCost:0,close:30,otherMarketing:0,rent:0,utilities:0,software:0,equipment:0,other:0,production:[0,0,0,0,0],agent:[0,0,0,0,0],employee:[2,2,100/12,100/12,100/12]};const defaults=JSON.stringify(state);const money=n=>n.toLocaleString('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0});const sum=a=>a.reduce((x,y)=>x+y,0);const commissions=r=>sum(state.production.map((p,i)=>p*r[i]/100));const salary=()=>state.wage*state.hours*state.weeks;const payroll=()=> (salary()+commissions(state.employee))*(1+state.tax/100)+state.benefits;const marketing=()=>state.leads*state.leadCost+state.otherMarketing;const maintenance=()=>sum(['rent','utilities','software','equipment','other'].map(k=>state[k]));const field=(label,key,index)=>'<label>'+label+'<input type="number" min="0" step="any" data-key="'+key+'" '+(index===undefined?'':'data-index="'+index+'"')+' value="'+(index===undefined?state[key]:state[key][index])+'"></label>';const card=(label,value)=>'<div class="card"><small>'+label+'</small><div class="amount">'+money(value)+'</div></div>';function render(){if(!ready)return;let s='<h2>'+page+'</h2>';if(page==='Home'){let income=state.revenue+commissions(state.agent)/12,profit=income-payroll()/12-marketing()-maintenance();s+='<div class="card hero"><small>Projected monthly operating profit · before owner taxes</small><div class="amount">'+money(profit)+'</div></div><div class="grid">'+card('Monthly revenue',income)+card('Modeled employee cost',payroll()/12)+card('Marketing',marketing())+card('Maintenance',maintenance())+'</div><div class="card">'+field('Existing monthly agency revenue (exclude modeled new sales)','revenue')+'</div>'}if(page==='Employees'){s+='<div class="grid">'+card('Annual base pay',salary())+card('Annual employee commission',commissions(state.employee))+card('Annual loaded cost',payroll())+card('First-year contribution before marketing and overhead',commissions(state.agent)-payroll())+'</div><div class="card">'+field('Hourly wage ($)','wage')+field('Hours per week','hours')+field('Paid weeks per year','weeks')+field('Employer payroll burden (%)','tax')+field('Annual employer benefits ($)','benefits')+'</div><div class="card"><h3>Annualized new production and staff rates</h3>'+products.map((p,i)=>field(p+' annual premium ($)','production',i)+field(p+' employee commission (% annual premium)','employee',i)).join('')+'</div>'}if(page==='Agent'){s+='<div class="grid">'+card('Modeled new annual gross commission',commissions(state.agent))+card('After modeled employee cost',commissions(state.agent)-payroll())+'</div><div class="card"><h3>Agent commission assumptions</h3>'+products.map((p,i)=>field(p+' (% annual premium)','agent',i)).join('')+'<p class="notice">Enter authorized rates manually. No official compensation schedules are included. Annualized projections are not cash receipts.</p></div>'}if(page==='Marketing'){s+='<div class="grid">'+card('Monthly marketing cost',marketing())+card('Lead cost per expected conversion',state.close>0?state.leadCost/(state.close/100):0)+'</div><div class="card">'+field('Monthly paid leads','leads')+field('Cost per lead ($)','leadCost')+field('Expected conversion (%)','close')+field('Other monthly marketing ($)','otherMarketing')+'<p>Expected conversions: '+(state.leads*state.close/100).toFixed(1)+'</p></div>'}if(page==='Maintenance'){s+=card('Monthly operating expenses',maintenance())+'<div class="card">'+['rent','utilities','software','equipment','other'].map(k=>field(k[0].toUpperCase()+k.slice(1)+' per month ($)',k)).join('')+'</div>'}document.querySelector('main').innerHTML=s+'<p class="notice">Planning estimates only • save changes manually • not a payroll or accounting system.</p>';document.querySelector('main').insertAdjacentHTML('beforeend','<div class="card"><button id="save">Save changes</button> <button id="logout">Sign out</button><p id="saveStatus" role="status"></p></div>');document.querySelector('#save').onclick=saveBudget;document.querySelector('#logout').onclick=()=>signOut(auth);document.querySelector('nav').innerHTML=pages.map((p,i)=>'<button data-page="'+p+'" '+(p===page?'aria-current="page"':'')+'><span>'+icons[i]+'</span>'+p+'</button>').join('');}document.addEventListener('change',e=>{let t=e.target;if(!ready||!t.dataset.key)return;let v=Math.max(0,Number(t.value)||0);if(t.dataset.key==='close')v=Math.min(100,v);if(t.dataset.index!==undefined)state[t.dataset.key][Number(t.dataset.index)]=v;else state[t.dataset.key]=v;render()});document.querySelector('nav').addEventListener('click',e=>{let b=e.target.closest('button');if(b){page=b.dataset.page;render();window.scrollTo(0,0)}});document.querySelector('#theme').onclick=()=>document.documentElement.toggleAttribute('data-dark');
const main=document.querySelector('main'),nav=document.querySelector('nav');
function login(){nav.innerHTML='';main.innerHTML='<div class="card"><h2>Sign in</h2><form id="login"><label>Email<input type="email" name="email" required autocomplete="username"></label><label>Password<input type="password" name="password" required autocomplete="current-password"></label><button>Sign in</button><p id="message" role="status"></p></form><p class="notice">Access is restricted to approved accounts.</p></div>';document.querySelector('#login').onsubmit=async e=>{e.preventDefault();const form=e.currentTarget;const msg=document.querySelector('#message');try{form.querySelector('button').disabled=true;await signInWithEmailAndPassword(auth,form.elements.email.value,form.elements.password.value);}catch(err){msg.textContent='Unable to sign in. Verify your account and Firebase setup.';form.querySelector('button').disabled=false;}};}
async function saveBudget(){if(!ready||!current)return;const token=epoch;const status=document.querySelector('#saveStatus');const button=document.querySelector('#save');button.disabled=true;try{await setDoc(doc(db,'budgets',current.uid),{values:JSON.parse(JSON.stringify(state)),updatedAt:serverTimestamp()});if(token===epoch&&status.isConnected)status.textContent='Saved to Firebase.';}catch(e){if(token===epoch&&status.isConnected)status.textContent='Save failed. Check connection and permissions.';}finally{if(button.isConnected)button.disabled=false;}}
try{await setPersistence(auth,browserSessionPersistence);onAuthStateChanged(auth,async user=>{const token=++epoch;ready=false;current=null;state=JSON.parse(defaults);page='Home';nav.innerHTML='';if(!user){login();return;}main.innerHTML='<p>Checking access…</p>';try{const allowed=await getDocFromServer(doc(db,'approvedUsers',user.uid));if(!allowed.exists()||allowed.data().active!==true)throw new Error('Not approved');const saved=await getDocFromServer(doc(db,'budgets',user.uid));if(token!==epoch)return;const values=saved.data()?.values||{};for(const k of Object.keys(state)){const v=values[k];if(Array.isArray(state[k])){if(Array.isArray(v)&&v.length===state[k].length&&v.every(n=>typeof n==='number'&&Number.isFinite(n)&&n>=0))state[k]=v;}else if(typeof v==='number'&&Number.isFinite(v)&&v>=0)state[k]=v;}current=user;ready=true;render();}catch(e){if(token!==epoch)return;main.innerHTML='<div class="card"><h2>Access unavailable</h2><p>Your account must be approved and database rules published before you can use the app.</p><button id="exit">Sign out</button></div>';document.querySelector('#exit').onclick=()=>signOut(auth);}});}catch(e){main.textContent='Firebase connection unavailable. Reload to try again.';}
</script></body></html>
