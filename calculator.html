<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f6fa"><title>Agency Calculator | Agency Compass</title>
<style>
:root{color-scheme:light;--bg:#f3f6fa;--card:#fff;--soft:#f8faff;--ink:#192943;--muted:#65758e;--line:#e1e8f0;--blue:#315fc9;--tint:#edf2ff;--green:#168052;--red:#c74451;font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);line-height:1.45}body.dark{color-scheme:dark;--bg:#0c1422;--card:#141f31;--soft:#19263a;--ink:#edf3ff;--muted:#a5b2c7;--line:#293951;--blue:#86a8ff;--tint:#203357;--green:#70d8a3;--red:#ff9292}
.wrap{max-width:940px;margin:auto;padding:16px 13px 40px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.title{font-size:20px;font-weight:750}.muted,.note{color:var(--muted);font-size:13px}.hero{background:linear-gradient(135deg,#244fba,#4384db);color:white;border-radius:20px;padding:18px;margin-bottom:12px}.hero h1{font-size:23px;margin:0 0 4px}.hero p{margin:0 0 14px;color:#e3ebff;font-size:14px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#ffffff20;border-radius:14px;padding:11px}.stat label{font-size:12px;color:#e1e9ff;display:block}.stat b{font-size:21px;display:block;margin-top:3px}.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:16px;margin:12px 0}.head{display:flex;justify-content:space-between;gap:10px;margin-bottom:12px}.head h2{font-size:17px;margin:0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.field{min-width:0;display:flex;flex-direction:column;gap:5px}.field label{font-size:13px;color:var(--muted);font-weight:650}.field input,.field select,.btn,.scenario{font:inherit}.field input,.field select{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--soft);color:var(--ink)}.product{display:grid;grid-template-columns:80px repeat(3,minmax(55px,1fr));gap:6px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}.product:last-child{border:0}.product input{width:100%;min-width:0;padding:8px 5px;border:1px solid var(--line);border-radius:9px;background:var(--soft);color:var(--ink);font:inherit;font-size:13px}.pname{font-weight:700;font-size:13px}.colhead{font-size:11px;color:var(--muted)}.result{text-align:right;font-size:12px;font-weight:700}.callout{background:var(--tint);padding:11px;border-radius:12px;margin-top:10px;font-size:13px}.note{line-height:1.5;margin:10px 0 0}.btn{border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:var(--card);color:var(--ink);font-weight:650;cursor:pointer}.btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}.btn.soft{background:var(--tint);color:var(--blue);border-color:transparent}.actions{display:flex;gap:7px;flex-wrap:wrap}.expense{display:grid;grid-template-columns:1fr 105px 28px;gap:7px;margin:6px 0}.expense input{min-width:0;width:100%;padding:8px;border:1px solid var(--line);border-radius:9px;background:var(--soft);color:var(--ink)}.remove{border:0;background:none;color:var(--red);font-size:20px}.total{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding:9px 0}.total strong{white-space:nowrap}.scenario{padding:9px;border:1px solid var(--line);border-radius:9px;background:var(--soft);color:var(--ink)}@media(max-width:520px){.wrap{padding:12px 10px 30px}.card{padding:13px}.stats{grid-template-columns:1fr 1fr}.stat:last-child{grid-column:span 2}.product{grid-template-columns:68px repeat(3,minmax(48px,1fr));gap:4px}.product input{font-size:12px;padding:7px 3px}.pname{font-size:12px}.colhead{font-size:10px}}
</style></head>
<body><div class="wrap">
<header class="top"><div><div class="title">Agency Compass · Calculator</div><div class="muted" id="saved">Saved on this device</div></div><div class="actions"><button class="btn" id="theme" aria-label="Toggle dark mode">◐</button><button class="btn" id="export">Export backup</button><button class="btn" id="import">Import backup</button><input hidden type="file" id="file" accept="application/json"></div></header>
<main id="app"></main></div>
<script>
(()=>{'use strict';
const products=['auto','fire','renters','life','health'],names={auto:'Auto',fire:'Home / Fire',renters:'Renters',life:'Life',health:'Supplemental health'},key='agency-compass-calculator-v1';
const defaults={salespeople:3,payMode:'Hourly',hourly:19,hours:37.5,weeks:52,annualPay:37050,otherPayroll:72000,payrollTax:7.65,benefits:3,retained:{auto:0,fire:0,renters:0,life:0,health:0},sales:{auto:0,fire:0,renters:0,life:0,health:0},agentRate:{auto:6,fire:8,renters:5,life:25,health:25},staffRate:{auto:2,fire:2,renters:2,life:8.33,health:8.33},vcMode:'production',vcNow:{auto:0,fire:0},vcPrior:{auto:0,fire:0},pif:{auto:0,fire:0},ces:0,pbp:0,bonus:0,otherIncome:0,staffRenewals:0,expenses:[{name:'Office and occupancy',monthly:4500},{name:'Marketing',monthly:1800},{name:'Technology',monthly:1200},{name:'Other operations',monthly:500}],scenarios:[],dark:false};
const copy=x=>JSON.parse(JSON.stringify(x));let state=copy(defaults);try{state={...state,...JSON.parse(localStorage.getItem(key)||'{}')}}catch{}
const $=s=>document.querySelector(s),n=x=>Number(x)||0,money=x=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(n(x));
function calc(){let retained=products.reduce((s,p)=>s+n(state.retained[p]),0),sales=Object.fromEntries(products.map(p=>[p,n(state.sales[p])])),agentNew=products.reduce((s,p)=>s+sales[p]*n(state.agentRate[p])/100,0),staffCom=products.reduce((s,p)=>s+sales[p]*n(state.staffRate[p])/100,0),rate=Object.fromEntries(['auto','fire'].map(p=>[p,Math.max(n(state.vcNow[p]),(n(state.vcNow[p])+n(state.vcPrior[p]))/2)])),vc=['auto','fire'].reduce((s,p)=>s+(state.vcMode==='pif'?n(state.pif[p]):sales[p])*rate[p]/100,0),extra=n(state.pbp)+n(state.bonus)+n(state.otherIncome),income=retained+agentNew+vc+extra,payPer=state.payMode==='Hourly'?n(state.hourly)*n(state.hours)*n(state.weeks):n(state.annualPay),salesPayroll=payPer*n(state.salespeople),load=(salesPayroll+n(state.otherPayroll)+staffCom+n(state.staffRenewals))*(n(state.payrollTax)+n(state.benefits))/100,operating=state.expenses.reduce((s,e)=>s+n(e.monthly)*12,0),expenses=salesPayroll+n(state.otherPayroll)+staffCom+n(state.staffRenewals)+load+operating,totalSales=Object.values(sales).reduce((a,b)=>a+b,0);return {retained,sales,agentNew,staffCom,rate,vc,extra,income,payPer,salesPayroll,load,operating,expenses,net:income-expenses,totalSales}}
function field(label,path,value,suffix=''){return '<label class="field">'+label+'<div style="position:relative"><input type="number" min="0" step="'+(suffix==='%'?'.1':'100')+'" data-path="'+path+'" value="'+(Number(value)||0)+'"><span style="position:absolute;right:9px;top:9px;color:var(--muted)">'+suffix+'</span></div></label>'}
function productRow(p,section,val){let label=section==='retained'?'Annual retained commission $':section==='sales'?'Annual team premium $':section==='agentRate'?'Agent rate %':'Employee rate %';let calc=calc(),out=section==='sales'?money(calc.sales[p]/12)+'/mo · '+money(calc.sales[p]*n(state.agentRate[p])/100)+'/yr':section==='agentRate'?money(calc.sales[p]*n(val)/100)+'/yr':'';return '<div class="product"><div class="pname">'+names[p]+'</div><div><div class="colhead">'+label+'</div><input type="number" min="0" step="'+(section.endsWith('Rate')?'.1':'100')+'" data-path="'+section+'.'+p+'" value="'+(Number(val)||0)+'" aria-label="'+names[p]+' '+label+'"></div><div class="result">'+out+'</div><div class="result">'+(section==='sales'?money(calc.sales[p]*n(state.staffRate[p])/100)+'/yr':'')+'</div></div>'}
function render(){let x=calc();document.body.classList.toggle('dark',state.dark);$('#app').innerHTML='<section class="hero"><h1>Agency income & expense calculator</h1><p>Enter the annual commission retained from your book, new team premium, compensation assumptions, and operating costs.</p><div class="stats"><div class="stat"><label>Estimated income / year</label><b>'+money(x.income)+'</b></div><div class="stat"><label>Estimated expenses / year</label><b>'+money(x.expenses)+'</b></div><div class="stat"><label>Net before owner taxes</label><b>'+money(x.net)+'</b><label>'+money(x.net/12)+' per month</label></div></div></section>'+
'<section class="card"><div class="head"><div><h2>1 · Retained customer commission</h2><div class="muted">Annual commission dollars from existing customers, by product.</div></div></div>'+products.map(p=>productRow(p,'retained',state.retained[p])).join('')+'<p class="note">Enter agency commission income from renewals/book policies, not the customer premium. This is the income that continues while customers remain.</p></section>'+
'<section class="card"><div class="head"><div><h2>2 · New team sales</h2><div class="muted">Enter total annual premium written by the team. Monthly and per-person totals calculate automatically.</div></div></div>'+field('Salespeople','salespeople',state.salespeople,'people')+'<div class="product"><div></div><div class="colhead">Annual team premium</div><div class="colhead">Monthly sales · agent commission</div><div class="colhead">Staff commission</div></div>'+products.map(p=>productRow(p,'sales',state.sales[p])).join('')+'<div class="callout"><b>Total premium:</b> '+money(x.totalSales)+'/year · '+money(x.totalSales/12)+'/month · '+money(x.totalSales/(n(state.salespeople)||1))+'/person/year · '+money(x.totalSales/(n(state.salespeople)||1)/12)+'/person/month.<br><b>Agent new commission:</b> '+money(x.agentNew)+'/year · '+money(x.agentNew/12)+'/month.</div></section>'+
'<section class="card"><div class="head"><div><h2>3 · Rates, variable compensation & contract add-ons</h2><div class="muted">Edit each agent and employee commission rate independently.</div></div></div><div class="grid">'+products.map(p=>field(names[p]+' agent rate','agentRate.'+p,state.agentRate[p],'%')).join('')+products.map(p=>field(names[p]+' employee commission','staffRate.'+p,state.staffRate[p],'%')).join('')+'</div><div class="callout"><b>Variable compensation · Auto and Fire</b><p class="note">Source summary describes the higher of current-year earned rate or current/prior-year average. Verify eligibility and schedule against your agreement.</p><div class="grid"><label class="field">Basis<select data-path="vcMode"><option value="production" '+(state.vcMode==='production'?'selected':'')+'>Annual production premium</option><option value="pif" '+(state.vcMode==='pif'?'selected':'')+'>Annual PIF gain premium</option></select></label>'+field('CES adjustment · Auto/Fire','ces',state.ces,'%')+['auto','fire'].map(p=>field(names[p]+' VC current-year rate','vcNow.'+p,state.vcNow[p],'%')+field(names[p]+' VC prior-year rate','vcPrior.'+p,state.vcPrior[p],'%')+(state.vcMode==='pif'?field(names[p]+' annual PIF gain premium','pif.'+p,state.pif[p],'$'):'')).join('')+'</div><p class="note">Current applied rates: Auto '+x.rate.auto.toFixed(2)+'% · Fire '+x.rate.fire.toFixed(2)+'%. Estimated variable compensation: '+money(x.vc)+'/year.</p></div><div class="grid" style="margin-top:12px">'+field('PBP estimate / year','pbp',state.pbp,'$')+field('Agent scorecard bonus / year','bonus',state.bonus,'$')+field('Other new-contract income / year','otherIncome',state.otherIncome,'$')+field('Employee renewal commission / year','staffRenewals',state.staffRenewals,'$')+'</div><p class="note">Variable comp, PBP, scorecard bonus and product schedules are editable planning assumptions. Source summary is not an executed contract. $0 is assumed until you enter a verified amount.</p></section>'+
'<section class="card"><div class="head"><div><h2>4 · Expenses</h2><div class="muted">Base pay, employee commissions, employer load and monthly costs.</div></div></div><div class="grid"><label class="field">Sales-team pay basis<select data-path="payMode"><option '+(state.payMode==='Hourly'?'selected':'')+'>Hourly</option><option '+(state.payMode==='Annual'?'selected':'')+'>Annual</option></select></label>'+(state.payMode==='Hourly'?field('Hourly rate / salesperson','hourly',state.hourly,'$')+field('Hours per week','hours',state.hours,'hr')+field('Paid weeks per year','weeks',state.weeks,'weeks'):field('Annual base pay / salesperson','annualPay',state.annualPay,'$'))+field('Other staff payroll / year','otherPayroll',state.otherPayroll,'$')+field('Payroll tax estimate','payrollTax',state.payrollTax,'%')+field('Benefits & retirement estimate','benefits',state.benefits,'%')+'</div><div class="callout">Sales-team base pay: <b>'+money(x.salesPayroll)+'</b> · Staff sales commission: <b>'+money(x.staffCom)+'</b> · Employer burden: <b>'+money(x.load)+'</b> per year.</div><div class="head" style="margin-top:17px"><div><h2>Monthly operating expenses</h2><div class="muted">Edit, add, or remove recurring costs.</div></div><button class="btn soft" id="addExpense">＋ Add</button></div>'+state.expenses.map((e,i)=>'<div class="expense"><input data-expname="'+i+'" value="'+esc(e.name)+'" aria-label="Expense name"><input type="number" min="0" step="50" data-exp="'+i+'" value="'+n(e.monthly)+'" aria-label="Monthly amount"><button class="remove" data-remove="'+i+'">×</button></div>').join('')+'<div class="total"><span>Operating expenses</span><strong>'+money(x.operating)+'/year · '+money(x.operating/12)+'/month</strong></div><div class="total"><span>Total expenses</span><strong>'+money(x.expenses)+'/year · '+money(x.expenses/12)+'/month</strong></div></section>'+
'<section class="card"><div class="head"><div><h2>5 · Save or export scenarios</h2><div class="muted">Data stays in this browser unless exported.</div></div></div><div class="actions"><input class="scenario" id="scenarioName" placeholder="Scenario name"><button class="btn soft" id="saveScenario">Save scenario</button><select id="scenarios" class="scenario"><option value="">Saved scenarios</option>'+state.scenarios.map((s,i)=>'<option value="'+i+'">'+esc(s.name)+'</option>').join('')+'</select><button class="btn" id="loadScenario">Load</button><button class="btn" id="csv">Export summary CSV</button></div><p class="note">This GitHub Pages version uses local browser storage and contains only fictional starter assumptions. Do not enter confidential agency data on a public website.</p></section>'}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function save(){localStorage.setItem(key,JSON.stringify(state));$('#saved').textContent='Saved on this device'}function set(path,v){let p=path.split('.'),o=state;for(let k of p.slice(0,-1))o=o[k];o[p.at(-1)]=['vcMode','payMode'].includes(path)?v:Number(v)||0}function download(name,text,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
document.addEventListener('input',e=>{let t=e.target;if(t.dataset.path){let p=t.dataset.path;set(p,t.value);save();render();[...document.querySelectorAll('[data-path]')].find(x=>x.dataset.path===p)?.focus({preventScroll:true})}else if(t.dataset.exp!==undefined){let i=t.dataset.exp;state.expenses[+i].monthly=Number(t.value)||0;save();render();[...document.querySelectorAll('[data-exp]')].find(x=>x.dataset.exp===i)?.focus({preventScroll:true})}else if(t.dataset.expname!==undefined){state.expenses[+t.dataset.expname].name=t.value;save()}});document.addEventListener('change',e=>{if(e.target.dataset.path){set(e.target.dataset.path,e.target.value);save();render()}});
$('#app').addEventListener('click',e=>{let t=e.target;if(t.id==='addExpense'){state.expenses.push({name:'New expense',monthly:0});save();render()}if(t.dataset.remove!==undefined){state.expenses.splice(+t.dataset.remove,1);save();render()}if(t.id==='saveScenario'){state.scenarios.unshift({name:$('#scenarioName').value.trim()||'Scenario '+(state.scenarios.length+1),state:copy(state)});save();render()}if(t.id==='loadScenario'){let s=state.scenarios[+$('#scenarios').value];if(s){let a=state.scenarios;state={...copy(s.state),scenarios:a};save();render()}}if(t.id==='csv'){let x=calc(),rows=[['Metric','Annual','Monthly'],['Retained commission',x.retained,x.retained/12],['New agent commission',x.agentNew,x.agentNew/12],['Variable compensation',x.vc,x.vc/12],['Other contract income',x.extra,x.extra/12],['Total income',x.income,x.income/12],['Total expenses',x.expenses,x.expenses/12],['Net before owner taxes',x.net,x.net/12]];download('agency-calculator-summary.csv',rows.map(r=>r.join(',')).join('\n'),'text/csv')}});
$('#theme').onclick=()=>{state.dark=!state.dark;document.body.classList.toggle('dark',state.dark);save()};$('#export').onclick=()=>download('agency-calculator-backup.json',JSON.stringify(state,null,2),'application/json');$('#import').onclick=()=>$('#file').click();$('#file').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{state={...copy(defaults),...JSON.parse(r.result)};save();render()}catch{alert('Unable to read this backup file.')}};r.readAsText(f)};render();
})();
</script></body></html>
